; 게임 로컬라이제이션 타깃.
;
; 영문(en)을 원본으로 두고, 번역이 준비되면 Content/Localization/Game/<culture>/Game.po만 채우면 된다.
; Content/Localization/Game/ 이하는 GatherText가 만드는 **생성물**이지 직접 작성하는 파일이 아니다.
;
; 수집 실행:
;   에디터 > Window > Localization Dashboard > Gather Text
;   또는 UnrealEditor-Cmd.exe LootNPop.uproject -run=GatherText -config="Config/Localization/Game.ini"
;
; ⚠️ 런타임 경로 등록은 필요 없다 — Engine/Config/BaseGame.ini가 이미
;   +LocalizationPaths=%GAMEDIR%Content/Localization/Game 를 갖고 있다.
;
; ⚠️ 사용자에게 보이는 문자열은 반드시 NSLOCTEXT/LOCTEXT로 쓴다. FText::FromString은 수집되지 않는다.
;   반대로 키 글리프(○, L1, ESC 같은 심볼)는 번역 대상이 아니므로 **일부러** FText::FromString을 쓴다.

[CommonSettings]
SourcePath=Content/Localization/Game
DestinationPath=Content/Localization/Game
ManifestName=Game.manifest
ArchiveName=Game.archive
PortableObjectName=Game.po
NativeCulture=en
CulturesToGenerate=en
CulturesToGenerate=ko

; C++ 소스의 LOCTEXT/NSLOCTEXT 수집
; ⚠️ 이 스텝은 IncludePathFilters가 아니라 **SearchDirectoryPaths**를 읽는다.
; 잘못 쓰면 "No search directory paths in section GatherTextStep0." 경고만 남기고
; 소스 문자열을 하나도 수집하지 않은 채 조용히 통과한다 (에셋 스텝은 정상 도는 탓에 눈치채기 어렵다).
[GatherTextStep0]
CommandletClass=GatherTextFromSource
SearchDirectoryPaths=Source/
ExcludePathFilters=Config/Localization/*
FileNameFilters=*.h
FileNameFilters=*.cpp
FileNameFilters=*.inl
ShouldGatherFromEditorOnlyData=false

; 에셋(위젯 BP, 데이터 테이블 등)의 FText 프로퍼티 수집
[GatherTextStep1]
CommandletClass=GatherTextFromAssets
IncludePathFilters=Content/*
ExcludePathFilters=Content/Localization/*
ExcludePathFilters=Content/Developers/*
PackageFileNameFilters=*.umap
PackageFileNameFilters=*.uasset
ShouldGatherFromEditorOnlyData=false
SkipGatherCache=false

[GatherTextStep2]
CommandletClass=GenerateGatherManifest
DestinationPath=Content/Localization/Game
ManifestName=Game.manifest

[GatherTextStep3]
CommandletClass=GenerateGatherArchive
DestinationPath=Content/Localization/Game
ManifestName=Game.manifest
ArchiveName=Game.archive

[GatherTextStep4]
CommandletClass=GenerateTextLocalizationResource
DestinationPath=Content/Localization/Game
ManifestName=Game.manifest
ArchiveName=Game.archive
ResourceName=Game.locres
