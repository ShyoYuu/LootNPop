; 호스트(리슨 서버) 화면에서만 LowLOD NPC가 사라지는 문제 대응.
;
; MassCrowd의 **서버 전용 표현 프로세서 2종**을 처리 파이프라인에서 제외한다.
;
; 둘 다 ExecutionFlags = Server 이고 쿼리 조건이 FMassCrowdTag 하나뿐이라,
; MassCrowdMemberTrait를 쓰는 이 프로젝트의 적 엔티티를 그대로 집어간다.
; 리슨 서버는 넷 모드 실행 플래그가 Client|Server(MassEntityUtils.cpp, NM_ListenServer 분기)라
; 클라이언트용 UMassCrowdVisualizationLODProcessor(Client|Standalone)와
; 서버용 UMassCrowdServerRepresentationLODProcessor(Server)가 **동시에 실행되어**
; 같은 FMassRepresentationLODFragment를 서로 덮어쓴다.
;
; 특히 UMassCrowdServerRepresentationLODProcessor는 거리 테이블이 생성자에 하드코딩돼 있다:
;   LODDistance[Medium/Low/Off] = 5000, LODMaxCount[Medium] = 0, LODMaxCount[Low] = 0
; → 5,000cm 밖은 전부 Off이고 Medium/Low는 정원이 0이라 **ISM 밴드가 존재할 수 없다.**
; 결과적으로 호스트(리슨 서버) 화면에서만 LowLOD NPC가 사라지고, 게스트는 정상으로 보인다.
; 두 프로세서가 번갈아 이기면서 표현이 점멸하기도 한다.
;
; 이 프로젝트는 UMassCrowdServerRepresentationTrait을 쓰지 않으므로 둘 다 불필요하다.
; (적 EntityConfig의 트레잇: LNPEnemyTrait / MassCrowdVisualizationTrait /
;  MassDistanceLODCollectorTrait / MassCrowdMemberTrait / MassStateTreeTrait /
;  MassAgentCapsuleCollisionSyncTrait / MassReplicationTrait)

[/Script/MassCrowd.MassCrowdServerRepresentationLODProcessor]
bAutoRegisterWithProcessingPhases=False

[/Script/MassCrowd.MassCrowdServerRepresentationProcessor]
bAutoRegisterWithProcessingPhases=False
