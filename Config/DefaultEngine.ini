; ─── 클라이언트당 대역폭 상한 (안전판) ────────────────────────────────────────
; ⚠️ 이 값은 **예산이 아니라 안전판**이다. 예산은 계측으로 지키고, 이 값은 그보다 위에 둔다.
;
; 150,000 = 피크 예산(다수 교전 시 짧게 100,000 B/s)의 1.5배다.
; 엔진 기본값 100,000을 그대로 쓰지 않는 이유: 그 값이 **피크 예산과 정확히 같아서**,
; 피크를 넘는 순간 상한에 눌린다. 그때의 실패 모드는 "조금 느려짐"이 아니라
; **원거리 오브젝트의 상태 갱신이 조용히 사라지는 것**이라 눈에 띄지 않는 결함으로 나타난다.
; 상한과 예산이 같으면 초과를 감지할 방법이 없어진다 — 상한은 반드시 예산 위에 둔다.
;
; ⚠️ 실효 상한은 **양쪽 클램프의 최솟값**이라 네 값을 함께 맞춰야 한다. 서버 값만 바꾸면
;    클라이언트가 보고한 값에 묶인다:
;   1) 클라이언트가 UNetConnection::InitBase에서 CurrentNetSpeed를 ConfiguredInternetSpeed로
;      잡고 NMT_Netspeed로 서버에 보고한다 (NetConnection.cpp:588, PendingNetGame.cpp:396)
;   2) 서버가 CurrentNetSpeed = Clamp(보고값, 1800, MaxClientRate) (World.cpp:7471)
;   3) 비-LAN이면 그 전에 MaxClientRate = min(MaxClientRate, MaxInternetClientRate) (World.cpp:7987)
;   (AGameNetworkManager::UpdateNetSpeeds의 동적 대역폭은 엔진 내 호출처가 없어 무관하다.)
[/Script/OnlineSubsystemUtils.IpNetDriver]
