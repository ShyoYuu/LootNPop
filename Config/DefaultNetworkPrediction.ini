

[/Script/NetworkPrediction.NetworkPredictionSettingsObject]
; SimulatedProxyNetworkLOD: 원격 플레이어(시뮬레이티드 프록시)를 클라이언트가 다루는 방식.
;   Interpolated  — 시뮬레이션 없이 수신 프레임 사이를 보간. 구조적으로 항상 과거를 재생하므로
;                   FixedTickInterpolationBufferedMS 만큼의 지연이 상시 존재한다.
;   ForwardPredict — 원격 폰도 로컬 캐릭터와 동일하게 풀 시뮬레이션 후 롤백 보정. 보간 버퍼 지연이 없다.
; Fixed 틱 정책에서만 시뮬레이티드 프록시의 ForwardPredict가 지원된다(NetworkPredictionConfig.h의
; FixedNetworkLODs/IndependentNetworkLODs 참조). 액션 반응성을 위해 ForwardPredict를 사용한다.
; FixedTickFrameRate: 1000을 나누어떨어지게 하는 값만 쓴다. 엔진은 스텝마다 실시간 1000/Rate ms를 소비하면서
; 시뮬레이션 dt는 그 정수 부분만 넘긴다(NetworkPredictionWorldManager.cpp OnWorldPreTick_Internal).
; 60이면 16.667ms를 쓰고 16ms만 시뮬레이션해 Mover 전체가 실시간의 0.96배로 돌았다(실효 중력 903cm/s²).
; 50(20ms)은 손실이 없다.
; 되돌릴 경우 아래 원본 줄로 교체할 것:
; Settings=(PreferredTickingPolicy=Fixed,ReplicatedManagerClassOverride=None,FixedTickFrameRate=60,bForceEngineFixTickForcePhysics=True,SimulatedProxyNetworkLOD=Interpolated,bEnableFixedTickSmoothing=True,FixedTickInterpolationBufferedMS=100,IndependentTickInterpolationBufferedMS=100,IndependentTickInterpolationMaxBufferedMS=250,FixedTickInputSendCount=6,IndependentTickInputSendCount=6,MaximumRemoteInputFaultLimit=6)
Settings=(PreferredTickingPolicy=Fixed,ReplicatedManagerClassOverride=None,FixedTickFrameRate=50,bForceEngineFixTickForcePhysics=True,SimulatedProxyNetworkLOD=ForwardPredict,bEnableFixedTickSmoothing=True,FixedTickInterpolationBufferedMS=100,IndependentTickInterpolationBufferedMS=100,IndependentTickInterpolationMaxBufferedMS=250,FixedTickInputSendCount=6,IndependentTickInputSendCount=6,MaximumRemoteInputFaultLimit=6)

